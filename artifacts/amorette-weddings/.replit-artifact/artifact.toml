kind = "web"
previewPath = "/"
title = "AMORETTE WEDDINGS"
description = "A complete luxury wedding planning and design website for Amorette Weddings, showcasing services, celebrations, and an inquiry form."
version = "1.0.0"
id = "artifacts/amorette-weddings"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25969

[services.development]
run = "pnpm --filter @workspace/amorette-weddings run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/amorette-weddings", "run", "build" ]
serve = "static"
publicDir = "artifacts/amorette-weddings/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25969"
BASE_PATH = "/"
